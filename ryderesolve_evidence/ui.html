<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RydeResolve · 证据核对台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172632;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#132d3b;color:white;padding:28px max(24px,calc((100vw - 1320px)/2))}header p{color:#c4d8e1;margin:9px 0 0}h1{font-size:26px;margin:0}main{max-width:1368px;margin:auto;padding:24px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}select,button{font:inherit;border:1px solid #adbec9;border-radius:8px;padding:10px;background:white}button{cursor:pointer;color:#075e6b}button:hover{background:#e8f4f4}button:focus-visible,select:focus-visible{outline:3px solid #f3b446}.badge{padding:5px 10px;border-radius:20px;background:#dfedf1;font-size:13px}.synthetic{background:#fff0d4;color:#795113}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:20px;margin-top:20px}.panel{background:white;border:1px solid #d7e1e6;border-radius:12px;padding:20px;min-width:0}h2{font-size:18px;margin:0 0 15px}.items{max-height:550px;overflow:auto;padding-right:6px}.record{border-bottom:1px solid #e5edf0;padding:12px 0}.record p{margin:8px 0;font-size:14px;line-height:1.65;overflow-wrap:anywhere}.small{color:#566974;font-size:13px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f9;padding:14px;border-radius:8px;font-size:12px;line-height:1.7;max-height:570px;overflow:auto}.issue{padding:10px 12px;background:#fff5e5;border-left:3px solid #d39b34;margin:10px 0;font-size:14px;line-height:1.6}.info{background:#eaf4f7;border-color:#327e91}#status{margin:15px 0}a{color:#066b7a}.wide{margin-top:20px}footer{padding:20px 0;color:#566974;font-size:13px}@media(max-width:760px){main{padding:16px}.grid{grid-template-columns:1fr}header{padding:22px 16px}h1{font-size:23px}.items{max-height:400px}}
</style>
<header><h1>RydeResolve · 证据核对台</h1><p>查看来源、比较记录、核对引用。用于 Evidence/Data 模块联调。</p></header>
<main><div class="toolbar"><label for="case">选择案例</label><select id="case"></select><span id="origin" class="badge"></span><button id="raw">查看原始 JSON</button><button id="download">下载 Evidence Pack</button></div><p id="status" role="status" aria-live="polite">正在加载案例…</p><div id="issues"></div><div class="grid"><section class="panel"><h2 id="factsTitle">事实记录</h2><div id="facts" class="items"></div></section><section class="panel"><h2 id="detailTitle">来源与计算</h2><p class="small">点击任意证据或政策编号，查看其原始条目。陈述、历史背景与计算结果的类型单独标注。</p><pre id="detail">请选择一条证据。</pre></section></div><section class="panel wide"><h2>适用规则</h2><div id="policies"></div></section><footer>官方样例含待澄清的计时差异；合成案例与自设规则均有标注。裁决与双方 Agent 由队友模块接入。</footer></main>
<script>
const $=id=>document.getElementById(id);let currentPack,currentAudit,caseList=[],requestVersion=0;
async function get(path){const r=await fetch(path);const value=await r.json();if(!r.ok)throw Error(value.error||'请求失败');return value}
function showError(e){$('status').textContent='加载失败：'+e.message}
function showDetail(title,data){$('detailTitle').textContent=title;$('detail').textContent=JSON.stringify(data,null,2)}
function renderRecords(items,target,policy=false){$(target).replaceChildren();for(const item of items){const row=document.createElement('div');row.className='record';const b=document.createElement('button');const id=policy?item.policy_id:item.evidence_id;b.textContent=id;b.setAttribute('aria-label','查看 '+id+' 的原始来源');const caseId=currentPack.case_id,hash=currentAudit.source_sha256; b.onclick=async()=>{try{const detail=await get('/cases/'+encodeURIComponent(caseId)+'/'+(policy?'policies':'evidence')+'/'+encodeURIComponent(id)+'?source_sha256='+hash);if(currentPack.case_id===caseId)showDetail(id+' · 原始来源',detail)}catch(e){showError(e)}};const p=document.createElement('p');p.textContent=policy?item.rule:item.fact;const source=document.createElement('span');source.className='small';source.textContent='来源：'+item.source;row.append(b,p,source);$(target).append(row)}}
async function load(){const version=++requestVersion;const caseId=$('case').value;$('status').textContent='正在读取原始记录与来源映射…';try{const[pack,audit]=await Promise.all([get('/cases/'+encodeURIComponent(caseId)),get('/cases/'+encodeURIComponent(caseId)+'/audit')]);if(version!==requestVersion)return;currentPack=pack;currentAudit=audit;const synthetic=audit.data_origin==='synthetic';$('origin').textContent=synthetic?'合成数据 · 自设规则':'主办方样例';$('origin').className='badge'+(synthetic?' synthetic':'');$('factsTitle').textContent='事实记录 · '+pack.facts.length+' 条';$('status').textContent=pack.case_id+' · '+(audit.requires_policy_or_data_review?'存在需要核实的数据或政策问题':'已生成证据与来源映射')+' · 来源版本 '+audit.source_sha256.slice(0,12);$('issues').replaceChildren();for(const issue of audit.issues){const el=document.createElement('div');el.className='issue'+(issue.severity==='info'?' info':'');el.textContent=issue.code+' — '+issue.message;$('issues').append(el)}renderRecords(pack.facts,'facts');renderRecords(pack.policy,'policies',true);showDetail('数据核对与计算结果',audit)}catch(e){if(version===requestVersion)showError(e)}}
$('case').onchange=load;$('raw').onclick=async()=>{if(!currentPack)return;const id=currentPack.case_id;try{const raw=await get('/cases/'+encodeURIComponent(id)+'/raw');if(currentPack.case_id===id)showDetail(id+' · 原始 JSON',raw)}catch(e){showError(e)}};
$('download').onclick=()=>{if(!currentPack)return;const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(currentPack,null,2)],{type:'application/json'}));a.href=url;a.download=currentPack.case_id+'.evidence_pack.json';a.click();URL.revokeObjectURL(url)};
(async()=>{try{caseList=await get('/cases');for(const item of caseList){const option=document.createElement('option');option.value=item.case_id;option.textContent=item.case_id+' · '+item.dispute_type;$('case').append(option)}await load()}catch(e){showError(e)}})();
</script></html>
